name: Tor Browser whole-RAM Linux integration

on:
  push:
    paths:
      - '.github/workflows/tor-whole-linux.yml'
      - 'benchmarks/tor_linux_whole_fixture.py'
      - 'benchmarks/tor_whole_image_validate.py'
      - 'plugins/tor_session_trace/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tor-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install analysis and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libdbus-glib-1-2 libgtk-3-0
          python -m pip install 'volatility3==2.28.2' selenium psutil
      - name: Download and verify Tor Browser 16.0
        run: |
          curl -fLsS -o tor-browser.tar.xz https://archive.torproject.org/tor-package-archive/torbrowser/16.0/tor-browser-linux-x86_64-16.0.tar.xz
          curl -fLsS -o tor-browser.tar.xz.asc https://archive.torproject.org/tor-package-archive/torbrowser/16.0/tor-browser-linux-x86_64-16.0.tar.xz.asc
          curl -fLsS -o geckodriver.tar.xz https://archive.torproject.org/tor-package-archive/torbrowser/16.0/geckodriver-linux-x86_64-16.0.tar.xz
          curl -fLsS -o geckodriver.tar.xz.asc https://archive.torproject.org/tor-package-archive/torbrowser/16.0/geckodriver-linux-x86_64-16.0.tar.xz.asc
          curl -fLsS -o tor-signing-key https://openpgpkey.torproject.org/.well-known/openpgpkey/torproject.org/hu/kounek7zrdx745qydx6p59t9mqjpuhdf
          gpg --batch --import tor-signing-key
          test "$(gpg --batch --with-colons --fingerprint torbrowser@torproject.org | awk -F: '$1=="fpr" {print $10; exit}')" = EF6E286DDA85EA2A4BA7DE684E2C6E8793298290
          gpg --batch --output tor.keyring --export EF6E286DDA85EA2A4BA7DE684E2C6E8793298290
          gpgv --keyring ./tor.keyring tor-browser.tar.xz.asc tor-browser.tar.xz
          gpgv --keyring ./tor.keyring geckodriver.tar.xz.asc geckodriver.tar.xz
          tar -xf tor-browser.tar.xz
          tar -xf geckodriver.tar.xz
          chmod +x geckodriver
      - name: Download AVML and build matching Linux symbol profile
        shell: bash
        run: |
          set -x
          curl -fLsS -o avml https://github.com/microsoft/avml/releases/download/v0.21.0/avml
          echo 'e75597dcdcaaa8475fdc61643effb050f72aaa9cff677c7271386a9781bf4460  avml' | sha256sum --check
          chmod +x avml
          test -r /sys/kernel/btf/vmlinux
          sudo cp "/boot/System.map-$(uname -r)" System.map
          sudo chown "$USER" System.map
          curl -fLsS -o btf2json https://github.com/vobst/btf2json/releases/download/v0.1.0/btf2json
          chmod +x btf2json
          mkdir -p symbols/linux
          if ! ./btf2json --btf /sys/kernel/btf/vmlinux --map System.map --banner "$(cat /proc/version)" > symbols/linux/current.json; then
            head -10 symbols/linux/current.json
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import volatility3
          schema = Path(volatility3.__file__).resolve().parent / 'schemas' / 'schema-6.2.0.json'
          source = schema.read_text()
          old = '"pattern": "^(dwarf|symtab|system-map)$"'
          assert old in source
          schema.write_text(source.replace(old, '"pattern": "^(btf|symdb|dwarf|symtab|system-map)$"'))
          PY
      - name: Capture whole RAM while Tor Browser renders an unvisited link
        run: |
          BROWSER=$(find "$PWD/tor-browser" -type f -name firefox | head -1)
          test -n "$BROWSER"
          python benchmarks/tor_linux_whole_fixture.py --browser "$BROWSER" --driver "$PWD/geckodriver" --avml "$PWD/avml" --image "$PWD/whole-ram.lime" --control "$PWD/control.json"
      - name: Find Tor Browser and link through Linux adapter
        run: python benchmarks/tor_whole_image_validate.py --target linux --image whole-ram.lime --symbols symbols --control control.json --output linux-tor-whole-result.json
      - name: Upload aggregate metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-tor-whole-result
          path: linux-tor-whole-result.json
          if-no-files-found: ignore
      - name: Remove local RAM capture
        if: always()
        run: rm -f whole-ram.lime
