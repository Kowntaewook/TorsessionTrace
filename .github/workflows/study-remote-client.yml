name: Remote-host onion study - separate client runners

on:
  workflow_dispatch:
    inputs:
      onion_hostname:
        description: Ephemeral v3 onion hostname from the service runner
        required: true
        type: string
      token:
        description: Per-run random target-path token
        required: true
        type: string
      service_run_id:
        description: Service workflow run ID for cross-run provenance
        required: true
        type: string

permissions:
  contents: read

jobs:
  remote-linux-client:
    runs-on: ubuntu-24.04
    env:
      ONION_HOSTNAME: ${{ inputs.onion_hostname }}
      REMOTE_TOKEN: ${{ inputs.token }}
      SERVICE_RUN_ID: ${{ inputs.service_run_id }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: [link_only, clicked]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install analysis and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libdbus-glib-1-2 libgtk-3-0 tor curl
          python -m pip install 'volatility3==2.28.2' 'yara-python==4.5.4' selenium psutil
      - name: Download and verify Tor Browser 16.0
        run: |
          curl -fLsS -o tor-browser.tar.xz https://archive.torproject.org/tor-package-archive/torbrowser/16.0/tor-browser-linux-x86_64-16.0.tar.xz
          curl -fLsS -o tor-browser.tar.xz.asc https://archive.torproject.org/tor-package-archive/torbrowser/16.0/tor-browser-linux-x86_64-16.0.tar.xz.asc
          curl -fLsS -o geckodriver.tar.xz https://archive.torproject.org/tor-package-archive/torbrowser/16.0/geckodriver-linux-x86_64-16.0.tar.xz
          curl -fLsS -o geckodriver.tar.xz.asc https://archive.torproject.org/tor-package-archive/torbrowser/16.0/geckodriver-linux-x86_64-16.0.tar.xz.asc
          curl -fLsS -o tor-signing-key https://openpgpkey.torproject.org/.well-known/openpgpkey/torproject.org/hu/kounek7zrdx745qydx6p59t9mqjpuhdf
          gpg --batch --import tor-signing-key
          test "$(gpg --batch --with-colons --fingerprint torbrowser@torproject.org | awk -F: '$1=="fpr" {print $10; exit}')" = EF6E286DDA85EA2A4BA7DE684E2C6E8793298290
          gpg --batch --output tor.keyring --export EF6E286DDA85EA2A4BA7DE684E2C6E8793298290
          gpgv --keyring ./tor.keyring tor-browser.tar.xz.asc tor-browser.tar.xz
          gpgv --keyring ./tor.keyring geckodriver.tar.xz.asc geckodriver.tar.xz
          tar -xf tor-browser.tar.xz
          tar -xf geckodriver.tar.xz
          chmod +x geckodriver
      - name: Download AVML and build matching Linux symbol profile
        shell: bash
        run: |
          set -x
          curl -fLsS -o avml https://github.com/microsoft/avml/releases/download/v0.21.0/avml
          echo 'e75597dcdcaaa8475fdc61643effb050f72aaa9cff677c7271386a9781bf4460  avml' | sha256sum --check
          chmod +x avml
          test -r /sys/kernel/btf/vmlinux
          sudo cp /sys/kernel/btf/vmlinux vmlinux.btf
          sudo chown "$USER" vmlinux.btf
          sudo cp "/boot/System.map-$(uname -r)" System.map
          sudo chown "$USER" System.map
          curl -fLsS -o btf2json https://github.com/vobst/btf2json/releases/download/v0.1.0/btf2json
          chmod +x btf2json
          mkdir -p symbols/linux
          if ! ./btf2json --btf vmlinux.btf --map System.map --banner "$(cat /proc/version)" > symbols/linux/current.json; then
            head -10 symbols/linux/current.json
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import volatility3
          schema = Path(volatility3.__file__).resolve().parent / 'schemas' / 'schema-6.2.0.json'
          source = schema.read_text()
          old = '"pattern": "^(dwarf|symtab|system-map)$"'
          assert old in source
          schema.write_text(source.replace(old, '"pattern": "^(btf|symdb|dwarf|symtab|system-map)$"'))
          PY
      - name: Capture Tor Browser using a service on another runner
        run: |
          BROWSER=$(find "$PWD/tor-browser" -type f -name firefox | head -1)
          test -n "$BROWSER"
          python benchmarks/study_remote_client.py --hostname "$ONION_HOSTNAME" --token "$REMOTE_TOKEN" --service-run-id "$SERVICE_RUN_ID" --target-os linux --scenario '${{ matrix.scenario }}' --browser "$BROWSER" --driver "$PWD/geckodriver" --tor-binary /usr/bin/tor --capture-tool "$PWD/avml" --image "$PWD/whole-ram.lime" --control "$PWD/control.json"
          sudo chown "$USER" whole-ram.lime
      - name: Measure remote-onion URL recovery and blind baseline
        run: python benchmarks/study_remote_validate.py --target linux --image whole-ram.lime --symbols symbols --control control.json --output study-result.json
      - name: Upload aggregate metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-linux-${{ matrix.scenario }}
          path: study-result.json
          if-no-files-found: ignore
      - name: Remove local RAM capture
        if: always()
        run: rm -f whole-ram.lime
  remote-windows-client:
    runs-on: windows-2022
    env:
      ONION_HOSTNAME: ${{ inputs.onion_hostname }}
      REMOTE_TOKEN: ${{ inputs.token }}
      SERVICE_RUN_ID: ${{ inputs.service_run_id }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: [link_only, clicked]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install analysis and browser dependencies
        run: |
          python -m pip install 'volatility3==2.28.2' 'yara-python==4.5.4' selenium psutil
          python benchmarks/use_https_symbols.py
      - name: Download Tor Browser 16.0, geckodriver, and WinPmem
        shell: pwsh
        run: |
          curl.exe -fLsS --retry 3 -o tor-browser-portable.exe https://archive.torproject.org/tor-package-archive/torbrowser/16.0/tor-browser-windows-x86_64-portable-16.0.exe
          if ($LASTEXITCODE -ne 0) { throw 'Tor Browser download failed' }
          curl.exe -fLsS --retry 3 -o tor-sha256.txt https://archive.torproject.org/tor-package-archive/torbrowser/16.0/sha256sums-signed-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Tor checksum download failed' }
          $line = Get-Content tor-sha256.txt | Where-Object { $_ -match 'tor-browser-windows-x86_64-portable-16\.0\.exe$' } | Select-Object -First 1
          if (-not $line) { throw 'Tor Browser missing from official checksum list' }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash tor-browser-portable.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Tor Browser SHA-256 mismatch' }
          curl.exe -fLsS --retry 3 -o geckodriver.zip https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-win64.zip
          if ($LASTEXITCODE -ne 0) { throw 'geckodriver download failed' }
          if ((Get-FileHash geckodriver.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'dfed9315abe8d2fbc1b6161a2ee8002452e79cf05ee92fdc653a4e26bc35edd8') { throw 'geckodriver SHA-256 mismatch' }
          Expand-Archive geckodriver.zip -DestinationPath . -Force
          curl.exe -fLsS --retry 3 -o winpmem.exe https://github.com/Velocidex/WinPmem/releases/download/v4.0.rc1/go-winpmem_amd64_1.0-rc2_signed.exe
          if ($LASTEXITCODE -ne 0) { throw 'WinPmem download failed' }
          $sig = Get-AuthenticodeSignature .\winpmem.exe
          Write-Host "WinPmem Authenticode: $($sig.Status)"
      - name: Capture Tor Browser using a service on another runner
        shell: pwsh
        run: |
          & 'C:\Program Files\7-Zip\7z.exe' x -y tor-browser-portable.exe '-otor-browser-extracted' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract Tor Browser' }
          $browser = Get-ChildItem tor-browser-extracted -Recurse -Filter firefox.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $browser) { throw 'No Tor Browser firefox.exe found' }
          $tor = Get-ChildItem tor-browser-extracted -Recurse -Filter tor.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $tor) { throw 'No bundled Tor daemon found' }
          python benchmarks/study_remote_client.py --hostname "$env:ONION_HOSTNAME" --token "$env:REMOTE_TOKEN" --service-run-id "$env:SERVICE_RUN_ID" --target-os windows --scenario '${{ matrix.scenario }}' --browser "$browser" --driver "$PWD/geckodriver.exe" --tor-binary "$tor" --capture-tool "$PWD/winpmem.exe" --image "$PWD/whole-ram.raw" --control "$PWD/control.json"
      - name: Measure remote-onion URL recovery and blind baseline
        run: python benchmarks/study_remote_validate.py --target windows --image whole-ram.raw --control control.json --output study-result.json
      - name: Upload aggregate metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-windows-${{ matrix.scenario }}
          path: study-result.json
          if-no-files-found: ignore
      - name: Remove local RAM capture
        if: always()
        shell: pwsh
        run: Remove-Item whole-ram.raw -Force -ErrorAction SilentlyContinue
