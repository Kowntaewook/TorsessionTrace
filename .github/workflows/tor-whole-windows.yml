name: Tor Browser whole-RAM Windows integration

on:
  push:
    paths:
      - '.github/workflows/tor-whole-windows.yml'
      - 'benchmarks/tor_whole_image_validate.py'
      - 'plugins/tor_session_trace/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tor-full:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Volatility 3
        run: python -m pip install 'volatility3==2.28.2'
      - name: Download Tor Browser 16.0 and WinPmem with signed driver
        shell: pwsh
        run: |
          curl.exe -fLsS --retry 3 -o tor-browser-portable.exe https://archive.torproject.org/tor-package-archive/torbrowser/16.0/tor-browser-windows-x86_64-portable-16.0.exe
          if ($LASTEXITCODE -ne 0) { throw 'Tor Browser download failed' }
          curl.exe -fLsS --retry 3 -o tor-sha256.txt https://archive.torproject.org/tor-package-archive/torbrowser/16.0/sha256sums-signed-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Tor checksum download failed' }
          $line = Get-Content tor-sha256.txt | Where-Object { $_ -match 'tor-browser-windows-x86_64-portable-16\.0\.exe$' } | Select-Object -First 1
          if (-not $line) { throw 'Tor Browser missing from official checksum list' }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash tor-browser-portable.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Tor Browser SHA-256 mismatch' }
          curl.exe -fLsS --retry 3 -o winpmem.exe https://github.com/Velocidex/WinPmem/releases/download/v4.0.rc1/go-winpmem_amd64_1.0-rc2_signed.exe
          if ($LASTEXITCODE -ne 0) { throw 'WinPmem download failed' }
          $sig = Get-AuthenticodeSignature .\winpmem.exe
          Write-Host "WinPmem Authenticode: $($sig.Status)"
      - name: Launch Tor Browser with an offline link-only control
        shell: pwsh
        run: |
          & 'C:\Program Files\7-Zip\7z.exe' x -y tor-browser-portable.exe '-otor-browser-extracted' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract Tor Browser' }
          $browser = Get-ChildItem tor-browser-extracted -Recurse -Filter firefox.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $browser) { throw 'No Tor Browser firefox.exe found' }
          $token = [guid]::NewGuid().ToString('N')
          $link = "https://rendered-link.invalid/$token"
          $absent = "https://absent-control.invalid/$token"
          "<html><body><h1>TorSessionTrace offline test</h1><a href='$link'>Not visited</a></body></html>" | Set-Content -Path control-page.html -Encoding utf8
          $uri = [uri](Resolve-Path control-page.html).Path
          Start-Process -FilePath $browser -ArgumentList @('-headless', $uri.AbsoluteUri)
          Start-Sleep -Seconds 10
          $root = (Resolve-Path tor-browser-extracted).Path
          $processes = @(Get-CimInstance Win32_Process -Filter "Name='firefox.exe'" | Where-Object { $_.ExecutablePath -like "$root*" } | Sort-Object WorkingSetSize -Descending)
          if (-not $processes) { throw 'Tor Browser did not stay running' }
          $control = @{ rendered_link_url=$link; absent_control_url=$absent; browser_pids=@($processes | ForEach-Object { [int]$_.ProcessId }); browser_binary_sha256=(Get-FileHash $browser -Algorithm SHA256).Hash.ToLowerInvariant() }
          $control | ConvertTo-Json -Depth 5 | Set-Content -Path control.json -Encoding utf8
          Write-Host "Tor Browser processes: $($processes.Count)"
      - name: Capture whole-system RAM with WinPmem
        shell: pwsh
        run: |
          & .\winpmem.exe acquire -v whole-ram.raw
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path whole-ram.raw)) { throw 'Whole-RAM capture failed' }
          Write-Host "Captured bytes: $((Get-Item whole-ram.raw).Length)"
      - name: Find Tor Browser and controlled link through Windows adapter
        run: python benchmarks/tor_whole_image_validate.py --target windows --image whole-ram.raw --control control.json --output windows-tor-whole-result.json
      - name: Upload aggregate metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tor-whole-result
          path: windows-tor-whole-result.json
          if-no-files-found: ignore
      - name: Remove local RAM capture
        if: always()
        shell: pwsh
        run: Remove-Item whole-ram.raw -Force -ErrorAction SilentlyContinue
