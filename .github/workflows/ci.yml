name: TorSessionTrace CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-smoke:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Volatility 3
        run: python -m pip install 'volatility3==2.28.2'
      - name: Test artifact extraction
        run: python -m unittest discover -s tests -v
      - name: Check plugin registration and required PID option
        run: python tests/smoke_cli.py
